# Game Boy crates (SM83 target). Host-side build tools live in the separate
# `tools/` workspace.
[workspace]
members = [
    "crates/gb-rt",
    "crates/gb-rt-macros",
    "crates/gbdk-sys",
    "crates/gb-bank-macros",
    "crates/gb-bank",
    "crates/gb",
    "examples/template",
    "examples/slideshow",
    "examples/bank-test",
    "examples/gbdk/filltest",
    "examples/gbdk/rand",
    "examples/gbdk/paint",
    "examples/gbdk/apa-image",
    "examples/gbdk/colorbar",
    "examples/gbdk/dscan",
    "examples/gbdk/galaxy",
    "examples/gbdk/dtmf",
    "examples/gbdk/gbtype",
    "examples/gbdk/rpn",
    "examples/gbdk/lcd-isr-wobble",
    "examples/gbdk/comm",
    "examples/gbdk/sgb-pong",
]
# `cargo build` at the root builds the host-buildable library crates. The
# examples need the z80 toolchain and are built through their Makefile.
default-members = [
    "crates/gb-bank-macros",
    "crates/gb-bank",
]
resolver = "3"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(rust_analyzer)']

[profile.release]
opt-level = "s"
lto = false
