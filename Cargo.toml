# Game Boy crates (SM83 target). Host-side build tools live in the separate
# `tools/` workspace.
[workspace]
members = [
    "crates/*",
    "examples/bank-test",
    "examples/slideshow",
    "examples/template",
    "examples/gbdk/*",
]
# `cargo build`/`cargo doc` at the root (sm83 target, see .cargo/config.toml)
# operate on the library crates. Examples are built with `cargo gb`.
default-members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# Internal crates.
gb = { path = "crates/gb" }
gb-hram = { path = "crates/gb-hram" }
gb-ram-fn = { path = "crates/gb-ram-fn" }
gb-ram-fn-macros = { path = "crates/gb-ram-fn-macros" }
gb-rt = { path = "crates/gb-rt" }
gb-rt-macros = { path = "crates/gb-rt-macros" }
gbdk-sys = { path = "crates/gbdk-sys" }
gb-bank = { path = "crates/gb-bank" }
gb-bank-macros = { path = "crates/gb-bank-macros" }
gb-bank-safe = { path = "crates/gb-bank-safe" }
# Shared third-party crates.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(rust_analyzer)']

[profile.release]
opt-level = "s"
lto = false
