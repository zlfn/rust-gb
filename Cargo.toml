# Game Boy crates (SM83 target). Host-side build tools live in the separate
# `tools/` workspace.
[workspace]
members = [
    "crates/*",
    "examples/bank-test",
    "examples/slideshow",
    "examples/template",
    "examples/gbdk/*",
]
# The library crates target SM83 (see crates' own builds); `cargo doc-all` docs
# them from the root. Examples are built with `cargo gb`.
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["zlfn <ung@zlfn.space>"]
license = "Zlib OR Apache-2.0 OR MIT"
repository = "https://github.com/zlfn/rust-gb"
keywords = ["gameboy", "sm83", "retro", "embedded", "no-std"]
categories = ["embedded", "no-std", "game-development", "hardware-support"]

[workspace.dependencies]
# Internal crates.
gb-bank = { path = "crates/gb-bank", version = "0.2.0" }
gb-bank-macros = { path = "crates/gb-bank-macros", version = "0.2.0" }
gb-bank-safe = { path = "crates/gb-bank-safe", version = "0.2.0" }
gb-hram = { path = "crates/gb-hram", version = "0.2.0" }
gb-pak = { path = "crates/gb-pak", version = "0.2.0" }
gb-pak-macros = { path = "crates/gb-pak-macros", version = "0.2.0" }
gb-ram-fn = { path = "crates/gb-ram-fn", version = "0.2.0" }
gb-ram-fn-macros = { path = "crates/gb-ram-fn-macros", version = "0.2.0" }
gb-rt = { path = "crates/gb-rt", version = "0.2.0" }
gb-rt-macros = { path = "crates/gb-rt-macros", version = "0.2.0" }
gbdk-sys = { path = "crates/gbdk-sys", version = "0.1" }
# Shared third-party crates.
critical-section = "1"
document-features = "0.2"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[profile.release]
opt-level = "s"
lto = "fat"
