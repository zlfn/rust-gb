# Game Boy crates (SM83 target). Host-side build tools live in the separate
# `tools/` workspace.
[workspace]
members = [
    "crates/gb-rt",
    "crates/gb-rt-macros",
    "crates/gbdk-sys",
    "crates/gb-bank-macros",
    "crates/gb-bank",
    "crates/gb-hram",
    "crates/gb",
    "examples/template",
    "examples/slideshow",
    "examples/bank-test",
    "examples/gbdk/filltest",
    "examples/gbdk/rand",
    "examples/gbdk/paint",
    "examples/gbdk/apa-image",
    "examples/gbdk/colorbar",
    "examples/gbdk/dscan",
    "examples/gbdk/galaxy",
    "examples/gbdk/dtmf",
    "examples/gbdk/gbtype",
    "examples/gbdk/rpn",
    "examples/gbdk/lcd-isr-wobble",
    "examples/gbdk/comm",
    "examples/gbdk/sgb-pong",
    "examples/gbdk/hram",
]
# `cargo build`/`cargo doc` at the root (sm83 target, see .cargo/config.toml)
# operate on the library crates. Examples are built with `cargo gb`.
default-members = [
    "crates/gb",
    "crates/gb-hram",
    "crates/gb-bank",
    "crates/gb-bank-macros",
    "crates/gb-rt",
    "crates/gb-rt-macros",
    "crates/gbdk-sys",
]
resolver = "3"

[workspace.dependencies]
# Internal crates.
gb = { path = "crates/gb" }
gb-hram = { path = "crates/gb-hram" }
gb-rt = { path = "crates/gb-rt" }
gb-rt-macros = { path = "crates/gb-rt-macros" }
gbdk-sys = { path = "crates/gbdk-sys" }
gb-bank = { path = "crates/gb-bank" }
gb-bank-macros = { path = "crates/gb-bank-macros" }
# Shared third-party crates.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(rust_analyzer)']

[profile.release]
opt-level = "s"
lto = false
