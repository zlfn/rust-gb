# Game Boy ROM Header Configuration
# Place as `header.toml` in your example/project directory.

# ROM title (max 15 chars for Hybrid/CgbOnly, 16 for None)
title = "UNTITLED"

# CGB flag: "None" (DMG only), "Hybrid" (DMG+CGB), "CgbOnly" (CGB only)
cgb_flag = "None"

# SGB flag: Super Game Boy support
# NOTE: Enabling SGB forces old_licensee_code to 0x33 (required by SGB hardware)
sgb_flag = false

# Cartridge type, by name. The header byte is accepted too (0x19 for "MBC5").
# "ROM"
# "MBC1"  "MBC1+RAM"  "MBC1+RAM+BATTERY"
# "MBC2"  "MBC2+BATTERY"
# "MBC3"  "MBC3+RAM"  "MBC3+RAM+BATTERY"
# "MBC3+TIMER+BATTERY"  "MBC3+TIMER+RAM+BATTERY"
# "MBC5"  "MBC5+RAM"  "MBC5+RAM+BATTERY"
# "MBC5+RUMBLE"  "MBC5+RUMBLE+RAM"  "MBC5+RUMBLE+RAM+BATTERY"
# "MBC7"  ("MBC7+SENSOR+RUMBLE+RAM+BATTERY")
cartridge_type = "ROM"

# RAM size
# 0x00 = None   0x01 = 2KB   0x02 = 8KB   0x03 = 32KB
ram_size = 0x00

# Destination: "japan" or "worldwide"
destination = "worldwide"

# Old licensee code (single byte)
old_licensee_code = 0x00

# New licensee code (2 ASCII chars)
# NOTE: Setting this forces old_licensee_code to 0x33
# new_licensee_code = "01"

# Mask ROM version
version = 0x00

# Reach the banks that need the cartridge's second bank register: 32-127 on MBC1,
# 256-511 on MBC5. Changing this recompiles the program, because it widens a bank
# number and changes how selecting one reaches the cartridge. It also gives up
# linking `gbdk-sys`, whose runtime writes only the first register.
# wide_banks = false
