# Game Boy ROM Header Configuration
# Place as `header.toml` in your example/project directory.

# ROM title (max 15 chars for Hybrid/CgbOnly, 16 for None)
title = "UNTITLED"

# CGB flag: "None" (DMG only), "Hybrid" (DMG+CGB), "CgbOnly" (CGB only)
cgb_flag = "None"

# SGB flag: Super Game Boy support
# NOTE: Enabling SGB forces old_licensee_code to 0x33 (required by SGB hardware)
sgb_flag = false

# Cartridge type (MBC)
# 0x00 = ROM ONLY          0x01 = MBC1            0x02 = MBC1+RAM
# 0x03 = MBC1+RAM+BATTERY  0x05 = MBC2            0x06 = MBC2+BATTERY
# 0x08 = ROM+RAM           0x09 = ROM+RAM+BATTERY  0x0B = MMM01
# 0x0C = MMM01+RAM         0x0D = MMM01+RAM+BATTERY
# 0x0F = MBC3+TIMER+BATTERY
# 0x10 = MBC3+TIMER+RAM+BATTERY
# 0x11 = MBC3              0x12 = MBC3+RAM         0x13 = MBC3+RAM+BATTERY
# 0x19 = MBC5              0x1A = MBC5+RAM          0x1B = MBC5+RAM+BATTERY
# 0x1C = MBC5+RUMBLE       0x1D = MBC5+RUMBLE+RAM   0x1E = MBC5+RUMBLE+RAM+BATTERY
# 0xFC = POCKET CAMERA     0xFD = BANDAI TAMA5      0xFE = HuC3
# 0xFF = HuC1+RAM+BATTERY
cartridge_type = 0x00

# RAM size
# 0x00 = None   0x01 = 2KB   0x02 = 8KB   0x03 = 32KB
ram_size = 0x00

# Destination: "japan" or "worldwide"
destination = "worldwide"

# Old licensee code (single byte)
old_licensee_code = 0x00

# New licensee code (2 ASCII chars)
# NOTE: Setting this forces old_licensee_code to 0x33
# new_licensee_code = "01"

# Mask ROM version
version = 0x00
