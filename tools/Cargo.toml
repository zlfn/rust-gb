# Host-side build tools for rust-gb. Separate workspace: these run on the host
# (stable toolchain), unlike the Game Boy crates which target SM83.
[workspace]
members = ["gb-header-fix", "gb-bank-pack", "gb-image-fx", "cargo-gb"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["zlfn <ung@zlfn.space>"]
license = "Zlib OR Apache-2.0 OR MIT"
repository = "https://github.com/zlfn/rust-gb"
