# Shared ROM build pipeline. In-repo Game Boy crates (the examples) extend it:
#   extend = "../../rom.toml"
# Assumes the rust-gb repo layout: WORKSPACE_ROOT is the git root. The runtime
# (rrt0.s, gb.ld) is provided by the gb-rt crate, not the Makefile.

[config]
skip_core_tasks = true
default_to_workspace = false

[env]
TARGET = "sm83-nintendo-none-elf"
WORKSPACE_ROOT = { script = ["cd ${CARGO_MAKE_WORKING_DIRECTORY} && git rev-parse --show-toplevel"] }
OUT = "${CARGO_MAKE_WORKING_DIRECTORY}/target"
STATICLIB = "${WORKSPACE_ROOT}/target/${TARGET}/release/lib${CARGO_MAKE_CRATE_FS_NAME}.a"
NAME = "${CARGO_MAKE_CRATE_NAME}"
GB_HEADER_FIX = "${WORKSPACE_ROOT}/tools/target/release/gb-header-fix"
GB_BANK_PACK = "${WORKSPACE_ROOT}/tools/target/release/gb-bank-pack"

# ── Step 1: Build host tools ──

[tasks.build-host-tools]
description = "Build the host tools the ROM build needs (gb-header-fix, gb-bank-pack)"
script_runner = "@shell"
script = '''
cd "${WORKSPACE_ROOT}/tools" && RUSTUP_TOOLCHAIN=stable cargo build --release \
    -p gb-header-fix -p gb-bank-pack
'''

# ── Step 2: Compile Rust staticlib ──

[tasks.build-rust]
description = "Compile Rust staticlib (build.rs generates banks.rs if banks.toml exists)"
script_runner = "@shell"
script = '''
set -a && . "${WORKSPACE_ROOT}/.env" && set +a

GB_BANK_PACK="${GB_BANK_PACK}" cargo build --release
'''
dependencies = ["build-host-tools"]

# ── Step 3: Process .o files for banking ──

[tasks.create-out-dir]
command = "mkdir"
args = ["-p", "${OUT}"]

[tasks.bank-link]
description = "Rename sections, bin-pack, patch bank markers, generate linker script"
script_runner = "@shell"
script = '''
. "${WORKSPACE_ROOT}/.env"

# Banking is in use if the staticlib carries any per-module BANK marker.
HAS_BANKED=$(${LLVM_Z80_BIN}/llvm-nm "${STATICLIB}" 2>/dev/null | grep -c "bank4BANK" || true)

if [ "$HAS_BANKED" -gt 0 ]; then
    # Extract to a persistent dir: gb-bank-pack patches these objects (BANK
    # markers -> absolute bank numbers) in place, and the link step uses them
    # instead of the unpatched archive.
    BANK_OBJ="${OUT}/bank_obj"
    rm -rf "$BANK_OBJ" && mkdir -p "$BANK_OBJ"
    cd "$BANK_OBJ" && ${LLVM_Z80_BIN}/llvm-ar x "${STATICLIB}"
    cd "${CARGO_MAKE_WORKING_DIRECTORY}"

    HEADER_ARG=""
    [ -f "${CARGO_MAKE_WORKING_DIRECTORY}/header.toml" ] && \
        HEADER_ARG="--header ${CARGO_MAKE_WORKING_DIRECTORY}/header.toml"

    LLVM_Z80_BIN=${LLVM_Z80_BIN} ${GB_BANK_PACK} link \
        --obj $(find "$BANK_OBJ" -name "*.o") \
        $HEADER_ARG --out-dir "${OUT}/"

    # Repack the patched objects into an archive so the linker keeps archive
    # member-selection (avoids duplicate weak/common symbols from loose .o).
    rm -f "${OUT}/libbanked.a"
    ${LLVM_Z80_BIN}/llvm-ar rcs "${OUT}/libbanked.a" $(find "$BANK_OBJ" -name "*.o")
    rm -rf "$BANK_OBJ"
else
    rm -f "${OUT}/libbanked.a"
    echo "/* No banking */" > "${OUT}/gb_banked.ld"
fi
'''
dependencies = ["build-rust", "create-out-dir"]

# ── Step 4: Link ELF ──

[tasks.link]
script_runner = "@shell"
script = '''
. "${WORKSPACE_ROOT}/.env"

# The main linker script (gb.ld) and every supplementary `*.ld` are dropped into
# build-script OUT_DIRs (gb-rt emits gb.ld, gbdk-sys emits gbdk.ld). Collect them
# newest-first, one per filename, so stale build dirs don't double-define
# sections. gb.ld is pulled out as the main `-T`; the rest are supplementary.
LD_DIR="${WORKSPACE_ROOT}/target/${TARGET}/release/build"
GB_LD=$(ls -t ${LD_DIR}/*/out/gb.ld 2>/dev/null | head -1)
LD_ARGS=""
seen=" gb.ld "
for f in $(ls -t ${LD_DIR}/*/out/*.ld 2>/dev/null); do
    b=$(basename "$f")
    case "$seen" in *" $b "*) continue ;; esac
    seen="$seen$b "
    LD_ARGS="$LD_ARGS -T $f"
done

# The startup (rrt0) is compiled into the gb-rt crate via global_asm! and pulled
# into the staticlib by the #[gb_rt::entry] macro's reference to _reset, so it
# links as part of the archive (with banking it rides along inside libbanked.a).
# ENTRY(_reset) roots it. The linker script (gb.ld) comes from gb-rt's OUT_DIR.
#
# With banking, link the patched objects and allow the banks to share VMA 0x4000
# (--no-check-sections). The __current_bank shadow rides along in the archive
# (defined by gb-rt). Without banking, link the archive as usual.
if [ -f "${OUT}/libbanked.a" ]; then
    ${LLVM_Z80_BIN}/ld.lld \
        -T ${GB_LD} -L ${OUT} $LD_ARGS \
        --gc-sections --no-check-sections \
        ${OUT}/libbanked.a \
        -o ${OUT}/${NAME}.elf
else
    ${LLVM_Z80_BIN}/ld.lld \
        -T ${GB_LD} -L ${OUT} $LD_ARGS \
        --gc-sections \
        ${STATICLIB} \
        -o ${OUT}/${NAME}.elf
fi
'''
dependencies = ["bank-link"]

# ── Step 5: ROM output ──

[tasks.rom]
script_runner = "@shell"
script = '''
. "${WORKSPACE_ROOT}/.env"
${LLVM_Z80_BIN}/llvm-objcopy -O binary --gap-fill=0xFF \
    --remove-section=.hram --remove-section=.bss \
    ${OUT}/${NAME}.elf ${OUT}/${NAME}.gb

echo "=== Done: ${OUT}/${NAME}.gb ==="
'''
dependencies = ["link"]

[tasks.header-fix]
script_runner = "@shell"
script = '''
HEADER_TOML="${CARGO_MAKE_WORKING_DIRECTORY}/header.toml"
if [ -f "$HEADER_TOML" ]; then
    ${GB_HEADER_FIX} ${OUT}/${NAME}.gb "$HEADER_TOML"
fi
[ -f "${OUT}/bank_summary.txt" ] && cat "${OUT}/bank_summary.txt"
true
'''
dependencies = ["rom"]

[tasks.run]
description = "Build and launch emulator"
script_runner = "@shell"
script = '''${EMULATOR:-sameboy} ${OUT}/${NAME}.gb'''
dependencies = ["header-fix"]

[tasks.default]
alias = "header-fix"

[tasks.clean]
script_runner = "@shell"
script = '''rm -rf "${OUT}"'''
