# rust-gb workspace. ROM builds happen inside example/game crates, which extend
# the shared `rom.toml` pipeline. There is nothing to build at the root itself.

[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.default]
script_runner = "@shell"
script = '''
echo "rust-gb workspace: nothing to build at the root."
echo "  Build a ROM:  cd into an example or your game crate, then run: cargo make"
echo "  Build tools:  cargo make tools   (or: cd tools && cargo build --release)"
'''

[tasks.tools]
description = "Build the host tools (gb-header-fix, gb-bank-pack, gb-image-fx)"
script_runner = "@shell"
script = '''cd "$(git rev-parse --show-toplevel)/tools" && cargo build --release'''
