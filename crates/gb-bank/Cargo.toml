[package]
name = "gb-bank"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Compile-time-safe ROM bank switching for the Game Boy"

# `cargo-gb` sets this from `wide_banks` in header.toml; see `BankNumber`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(gb_wide_bank, values("mbc1", "mbc5"))',
    'cfg(gb_custom_mapper)',
    'cfg(gb_flat_rom)',
] }

[dependencies]
gb-bank-macros = { workspace = true }
gb-hram = { workspace = true, features = ["bank-safe"] }
gb-bank-safe = { workspace = true }
