[package]
name = "gb-hram"
version = "0.1.0"
edition = "2024"

[features]
## Require every cell value to be `BankSafe`, so a pointer to banked code cannot be
## parked in HRAM and outlive its bank.
bank-safe = ["dep:gb-bank-safe"]

[dependencies]
gb-bank-safe = { workspace = true, optional = true }
critical-section = "1"
document-features = "0.2"

# Build docs with all features so docs.rs shows the bounded form of the cells.
[package.metadata.docs.rs]
all-features = true
