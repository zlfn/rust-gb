[package]
name = "gb-hram"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://zlfn.github.io/rust-gb/gb_hram/"
keywords.workspace = true
categories.workspace = true
description = "Typed handles to the Game Boy's High RAM"

[features]
## Require every cell value to be `BankSafe`, so a pointer to banked code cannot be
## parked in HRAM and outlive its bank.
bank-safe = ["dep:gb-bank-safe"]

[dependencies]
gb-bank-safe = { workspace = true, optional = true }
critical-section = { workspace = true }
document-features = { workspace = true }

# Build docs with all features so docs.rs shows the bounded form of the cells.
[package.metadata.docs.rs]
all-features = true
