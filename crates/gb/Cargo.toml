[package]
name = "gb"
version = "0.1.0"
edition = "2024"
authors = ["zlfn <ung@zlfn.space>"]
description = "Safe, idiomatic Game Boy hardware abstractions"

[features]
default = []

## Enable ROM banking: the `gb::bank` module and the `#[gb::bank]` attribute.
bank = ["dep:gb-bank", "dep:gb-bank-macros"]

## Enable Game Boy Color hardware features.
cgb = []

## Register an implementation of the [`critical-section`](https://docs.rs/critical-section)
## crate.
##
## `IME` is write-only, so the implementation tracks every interrupt state change
## in a mirror variable, which costs a store in each [`gb::interrupt`](crate::interrupt)
## call and at the entry and exit of every handler. Turn it on only to link a
## driver that requires it; in your own code use
## [`free`](crate::interrupt::free) or the token a handler is already handed.
critical-section-impl = ["critical-section/restore-state-bool"]

[dependencies]
gb-rt = { workspace = true }
gb-hram = { workspace = true }
gb-bank = { workspace = true, optional = true }
gb-bank-macros = { workspace = true, optional = true }
gb-ram-fn = { workspace = true }
voladdress = "1.4.0"
critical-section = "1"
bitflags = "2"
bitfield-struct = "0.13.0"
document-features = "0.2"

# Build docs with all features so docs.rs shows the feature-gated API, and with
# `--cfg docsrs` so `doc(cfg)` marks what each item needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
